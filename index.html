<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐句錄音</title>
<style>
/* 尺度：間距 4 8 12 16 24 32 48 64｜字級 12 14 16 18 20 24 30 36｜字重 500 / 700 */
:root{
  --blue-600:hsl(232,100%,56%);--blue-700:hsl(232,85%,44%);--blue-100:hsl(232,100%,96%);--blue-200:hsl(232,90%,90%);
  --g-50:hsl(45,20%,97%);--g-100:hsl(45,14%,94%);--g-200:hsl(45,10%,88%);--g-300:hsl(45,6%,78%);--g-500:hsl(40,4%,46%);--g-700:hsl(40,5%,28%);--g-900:hsl(40,8%,10%);
  --red-600:hsl(4,74%,48%);--green-700:hsl(160,75%,27%);--green-100:hsl(155,60%,93%);
  --surface:#fff;--page:var(--g-50);--line:var(--g-200);--line-strong:var(--g-300);
  --text:var(--g-900);--text-2:var(--g-700);--text-3:var(--g-500);
  --action:var(--blue-600);--action-ink:#fff;--tint:var(--blue-100);--hover:var(--g-100);
  --sh-1:0 1px 3px hsla(0,0%,0%,.12);--sh-3:0 -4px 16px hsla(0,0%,0%,.08);
  --r:2px;--fs:22px;
}
@media (prefers-color-scheme:dark){:root{
  --surface:hsl(230,8%,13%);--page:hsl(230,8%,9%);--line:hsl(230,6%,22%);--line-strong:hsl(230,6%,34%);--hover:hsl(230,8%,17%);
  --text:hsl(45,15%,94%);--text-2:hsl(45,6%,76%);--text-3:hsl(45,4%,62%);
  --action:hsl(232,100%,66%);--tint:hsl(232,40%,20%);--blue-700:hsl(232,100%,76%);
  --red-600:hsl(4,85%,60%);--green-700:hsl(155,55%,55%);--green-100:hsl(155,35%,16%);
  --g-100:hsl(230,8%,17%);--g-200:hsl(230,6%,24%);--g-300:hsl(230,6%,34%);
  --sh-1:0 0 0 transparent;--sh-3:0 -4px 16px hsla(0,0%,0%,.5);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:500 16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:var(--r);padding:8px 16px;font-weight:700;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--action);outline-offset:2px}
button.primary{background:var(--action);color:var(--action-ink);box-shadow:var(--sh-1)}
button.primary:hover{background:var(--blue-700)}
button.danger{background:var(--red-600);color:#fff;box-shadow:var(--sh-1)}
button.ok{background:var(--green-700);color:#fff;box-shadow:var(--sh-1)}
button.link{background:none;box-shadow:none;color:var(--text-2);padding:8px;font-weight:500}
button.link:hover{color:var(--text);text-decoration:underline}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 12px}
textarea{width:100%;line-height:1.8;resize:vertical}
kbd{font:600 12px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--text-2);background:var(--surface)}
.muted{color:var(--text-3)}.small{font-size:14px}

.brand{background:var(--blue-600);color:#fff}
.brand .in{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand b{font-size:18px;letter-spacing:.06em;font-weight:800;cursor:pointer}
.brand .crumb{color:var(--blue-200);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 160px}

.steps{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text-3);margin-bottom:24px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px}
.steps i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--g-200);color:var(--text-2)}
.steps .on{color:var(--text);font-weight:700}.steps .on i{background:var(--action);color:#fff}
.steps .done i{background:var(--green-700);color:#fff}
.steps .sep{width:24px;height:1px;background:var(--line-strong)}

.home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px;font-weight:800}
h2{font-size:18px;margin:0 0 16px;font-weight:700}
.field{margin-top:16px}
.field label{display:block;font-size:14px;color:var(--text-2);margin-bottom:8px}
.field input{width:100%}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--text-2)}
.opts label{display:flex;gap:8px;align-items:center}
.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.proj{display:block;padding:16px 0;border-top:1px solid var(--line);cursor:pointer;color:inherit;text-decoration:none}
.proj:first-of-type{border-top:0;padding-top:0}
.proj .t{font-weight:700;font-size:16px}
.proj:hover .t{color:var(--action)}
.proj .m{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--text-3);margin-top:4px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--g-100);color:var(--text-2)}
.chip.done{background:var(--green-100);color:var(--green-700)}
.chip.prog{background:var(--tint);color:var(--blue-700)}
.bar{height:4px;background:var(--g-200);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green-700)}
.empty{color:var(--text-3);font-size:14px;line-height:1.7}

.editor{display:grid;grid-template-columns:48px 1fr;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);overflow:hidden}
.gutter{background:var(--g-100);color:var(--text-3);font:500 14px/32px ui-monospace,Menlo,monospace;text-align:right;padding:12px 8px;user-select:none;overflow:hidden}
.editor textarea{border:0;border-radius:0;font-size:18px;line-height:32px;padding:12px 16px;min-height:420px;white-space:pre;overflow-x:auto}

.head{margin-bottom:16px}
.head h1{font-size:24px;margin:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--page);display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.mic{display:flex;gap:8px;align-items:center}
.mic select{max-width:220px;padding:8px}
.meter{width:96px;height:8px;background:var(--g-200);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--green-700)}
.meter.hot i{background:var(--red-600)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 24px hsla(0,0%,0%,.14);padding:8px;min-width:340px;display:none;z-index:9}
.menu.open .pop{display:block}
.pop > button{display:block;width:100%;text-align:left;box-shadow:none;font-weight:500;padding:8px 12px}
.pop .sec{border-top:1px solid var(--line);margin-top:8px;padding:12px 12px 4px;font-size:14px;color:var(--text-2)}
.pop .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.pop .row button{padding:4px 10px;white-space:nowrap}
.pop .row{flex-wrap:wrap}
.pop input[type=number]{width:72px;text-align:center;padding:4px 8px}
.beat{width:12px;height:12px;border-radius:50%;background:var(--g-300);display:inline-block}
.beat.on{background:var(--action)}.beat.on.acc{background:var(--red-600)}
.metro-on{display:none;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.metro-on.show{display:flex}

.sent{display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:baseline;padding:12px 16px;border-radius:4px;cursor:pointer;color:var(--text-3)}
.sent:hover{background:var(--hover)}
.sent .n{font:500 14px ui-monospace,Menlo,monospace;text-align:right}
.sent .x{font-size:var(--fs);line-height:1.6;letter-spacing:.03em;word-break:break-word}
.sent .s{font-size:14px;white-space:nowrap}
.sent.done .s{color:var(--green-700);font-weight:700}
.sent.cur{background:var(--surface);color:var(--text);box-shadow:inset 4px 0 0 var(--action),var(--sh-1)}
.sent.cur .x{font-size:calc(var(--fs) * 1.25);font-weight:700}
.sent.recording{box-shadow:inset 4px 0 0 var(--red-600),var(--sh-1)}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--sh-3);z-index:6}
.dock .in{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dock .info{flex:1;min-width:200px}
.dock .where{font-size:14px;color:var(--text-3)}
.dock .state{font-size:16px;font-weight:700}
.dock .state.rec{color:var(--red-600)}
.dock .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dock .big{padding:12px 24px;font-size:16px;min-width:140px}
.dock .hint{width:100%;font-size:12px;color:var(--text-3);display:flex;gap:16px;flex-wrap:wrap}

.modal{position:fixed;inset:0;background:hsla(0,0%,0%,.4);display:grid;place-items:center;z-index:20;padding:24px}
.modal .box{background:var(--surface);border-radius:4px;padding:24px;width:min(860px,100%);max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 15px 35px hsla(0,0%,0%,.25)}
.modal .editor textarea{min-height:50vh}

.aistep{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.aistep > b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--action);color:#fff;display:grid;place-items:center;font-size:14px}
.row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row2 a{color:var(--action);font-weight:700}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--g-900);color:var(--g-50);padding:12px 16px;border-radius:var(--r);font-size:14px;display:none;z-index:30;max-width:90vw}

@media (max-width:760px){
  .wrap{padding:24px 16px 200px}.brand .in{padding:12px 16px}.dock .in{padding:12px 16px}
  .home{grid-template-columns:1fr;gap:24px}
  h1{font-size:24px}
  .sent{grid-template-columns:28px 1fr;gap:4px 12px;padding:12px}
  .sent .s{grid-column:2}
  .dock .big{min-width:0;flex:1}
  .dock .hint{display:none}
  .mic select{max-width:150px}
}
</style>
</head>
<body>
<header class="brand"><div class="in"><b id="logo">逐句錄音</b><span class="crumb" id="crumb"></span></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m, ms = 2400) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
async function api(path, opt = {}) { const r = await fetch(path, { ...opt, headers: { 'X-NR': '1', ...(opt.headers || {}) } }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }
const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const fmtDur = s => s >= 60 ? `${Math.floor(s / 60)} 分 ${Math.round(s % 60)} 秒` : `${Math.round(s)} 秒`;
const steps = n => `<div class="steps">${['貼上逐字稿', '調整斷句', '逐句錄音'].map((t, i) => `<span class="${i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''}"><i>${i + 1 < n ? '✓' : i + 1}</i>${t}</span>`).join('<span class="sep"></span>')}</div>`;
$('#logo').onclick = () => home();

/* ---------- 斷句 ---------- */
const MODES = [
  { v: 15, name: '短句', hint: '約 15 字，一口氣一句', ai: '一句大約 8 到 15 個字，一口氣講得完' },
  { v: 25, name: '一般', hint: '約 25 字，一個完整句子', ai: '一句是一個完整的句子，大約 15 到 25 個字' },
  { v: 40, name: '長句', hint: '約 40 字，兩三句連著講', ai: '每段是兩三句連在一起講的話，大約 25 到 40 個字' },
  { v: -1, name: '整段', hint: '照原稿的段落', ai: '照原稿的段落分，一個段落一行，段落太長（超過 80 字）再從句號切開' },
];
function splitScript(t, max, dropNotes) {
  t = t.replace(/\r/g, '');
  if (max === -1) { // 整段：只照原稿換行分段
    if (dropNotes) t = t.replace(/[（(【\[〔][^）)】\]〕\n]*[）)】\]〕]/g, '');
    return t.split(/\n+/).map(l => l.replace(/^\s*(#+|[-*•>]|\d+[.、])\s*/, '').trim()).filter(l => l && !/^```/.test(l));
  }
  if (dropNotes) t = t.replace(/[（(【\[〔][^）)】\]〕\n]*[）)】\]〕]/g, '');
  const out = [], len = x => [...x].length;
  for (let line of t.split(/\n+/)) {
    line = line.replace(/^\s*(#+|[-*•>]|\d+[.、])\s*/, '').trim();
    if (!line || /^```/.test(line)) continue;
    const parts = line.match(/[^。！？!?；;…]+[。！？!?；;…」』”"]*|[。！？!?；;…]+/g) || [line];
    const pieces = [];
    for (let s of parts) {
      s = s.trim(); if (!s || /^[。！？!?；;…，,\s]+$/.test(s)) continue;
      if (max && len(s) > max) pieces.push(...splitLong(s, max)); else pieces.push(s);
    }
    // 同一段裡，相鄰小段合併到接近設定長度；3 字以內的一律併進下一句
    let cur = '';
    for (const pc of pieces) {
      if (!cur) cur = pc;
      else if (len(cur) <= 3 || (max && len(cur + pc) <= max)) cur += pc;
      else { out.push(cur); cur = pc; }
    }
    if (cur) out.push(cur);
  }
  return out;
}
function splitLong(s, max) {
  const segs = s.match(/[^，,、：:]+[，,、：:]?/g) || [s];
  const res = []; let cur = '';
  for (const g of segs) { if (cur && [...(cur + g)].length > max) { res.push(cur); cur = g; } else cur += g; }
  if (cur) res.push(cur);
  return res;
}
function lineEditor(id, text) {
  return `<div class="editor"><div class="gutter" id="${id}-g"></div><textarea id="${id}" spellcheck="false" aria-label="句子，一行一句">${esc(text)}</textarea></div>`;
}
function bindEditor(id, onCount) {
  const ta = $('#' + id), g = $('#' + id + '-g');
  const upd = () => {
    let k = 0;
    g.innerHTML = ta.value.split('\n').map(l => l.trim() ? ++k : '').join('<br>');
    g.style.height = ta.offsetHeight + 'px'; g.scrollTop = ta.scrollTop;
    if (onCount) onCount(k);
  };
  ta.addEventListener('input', upd); ta.addEventListener('scroll', () => g.scrollTop = ta.scrollTop);
  new ResizeObserver(upd).observe(ta); upd();
}

/* ---------- 第一步：貼稿＋最近的稿子 ---------- */
let draft = { title: '', script: '' };
async function home() {
  leaveProject(); $('#crumb').textContent = '';
  if (location.hash) history.replaceState(null, '', location.pathname);
  let max = +(pref('mode') || 15); if (!MODES.some(m => m.v === max)) max = 15;
  app.innerHTML = `${steps(1)}
  <div class="home">
    <section class="panel">
      <h1>貼上逐字稿</h1>
      <p class="muted small" style="margin:0">會照你選的長短自動切好，下一步可以再調整。</p>
      <div class="field"><label for="title">影片名稱</label><input id="title" placeholder="例如：SV003 法務助手安裝教學" value="${esc(draft.title)}"></div>
      <div class="field"><label for="script">逐字稿</label><textarea id="script" rows="12" placeholder="把整份稿子貼在這裡">${esc(draft.script)}</textarea></div>
      <div class="opts">
        <label>每次錄多長 <select id="max">${MODES.map(m => `<option value="${m.v}" ${m.v === max ? 'selected' : ''}>${m.name}（${m.hint}）</option>`).join('')}</select></label>
        <label><input type="checkbox" id="notes" checked>去掉括號裡的畫面說明</label>
      </div>
      <div class="actions"><button id="ai">用 AI 斷句…</button><button class="primary" id="go">下一步：調整斷句</button></div>
    </section>
    <section>
      <h2>最近的稿子</h2>
      <div id="list" class="empty">讀取中…</div>
    </section>
  </div>`;
  $('#title').oninput = e => draft.title = e.target.value;
  $('#script').oninput = e => draft.script = e.target.value;
  $('#go').onclick = () => {
    pref('mode', $('#max').value);
    const lines = splitScript($('#script').value, +$('#max').value, $('#notes').checked);
    if (!lines.length) return toast('先貼上逐字稿');
    review(lines);
  };
  $('#ai').onclick = aiSplit;
  try {
    const ps = await api('/api/projects');
    $('#list').className = '';
    $('#list').innerHTML = ps.length ? ps.map(p => {
      const st = p.done === 0 ? ['', '還沒錄'] : p.done === p.total ? ['done', '錄完了'] : ['prog', `錄到第 ${p.done} 句`];
      return `<a class="proj" href="#p=${encodeURIComponent(p.slug)}" data-s="${esc(p.slug)}"><div class="t">${esc(p.title)}</div>
        <div class="m"><span class="chip ${st[0]}">${st[1]}</span><span>${p.done} / ${p.total} 句</span><span>${esc(p.created.slice(5))}</span></div>
        <div class="bar"><i style="width:${p.total ? 100 * p.done / p.total : 0}%"></i></div></a>`;
    }).join('') : '<p class="empty">還沒有稿子。左邊貼上第一份，或請 Claude Code 把稿子送進來。</p>';
    document.querySelectorAll('.proj').forEach(el => el.onclick = e => { e.preventDefault(); openProject(el.dataset.s); });
  } catch (e) { $('#list').textContent = '讀不到資料：' + e.message; }
}

/* ---------- 方法①：複製提示詞給自己的 AI ---------- */
const AI_PROMPT = `請幫我把下面的影片逐字稿斷句，方便我一句一句錄音。
規則：
1. {LEN}；照講話換氣的位置切
2. 不要把數字、英文詞、專有名詞切開
3. 拿掉括號裡的畫面說明和出處標記
4. 不要改字、不要加字，保留原本的標點
5. 只回傳結果：一行一句，不要編號，不要其他說明

逐字稿：
`;
function aiSplit() {
  const script = $('#script').value.trim();
  if (!script) return toast('先貼上逐字稿');
  const box = document.createElement('div'); box.className = 'modal';
  box.innerHTML = `<div class="box">
    <h2 style="margin:0">用 AI 斷句</h2>
    <p class="muted small" style="margin:0">用你自己的 ChatGPT 或 Claude，照換氣點斷，比自動斷句更自然。長短照你選的「${esc((MODES.find(m => m.v === +$('#max').value) || MODES[0]).name)}」。</p>
    <div class="aistep"><b>1</b><div><div>複製提示詞（已經連同你的逐字稿一起準備好）</div>
      <div class="row2"><button class="primary" id="cp">複製提示詞</button><a href="https://claude.ai/new" target="_blank" rel="noopener">開 Claude</a><a href="https://chatgpt.com/" target="_blank" rel="noopener">開 ChatGPT</a></div></div></div>
    <div class="aistep"><b>2</b><div>貼到 AI 的對話框送出</div></div>
    <div class="aistep"><b>3</b><div style="flex:1"><div>把 AI 回傳的結果整段複製，貼在這裡</div>
      <textarea id="aiout" rows="8" placeholder="一行一句"></textarea></div></div>
    <div class="actions" style="margin-top:0"><button class="link" id="aino">取消</button><button class="primary" id="aiok">用這個結果</button></div>
  </div>`;
  document.body.appendChild(box);
  $('#cp').onclick = async () => {
    const mode = MODES.find(m => m.v === +$('#max').value) || MODES[0];
    const text = AI_PROMPT.replace('{LEN}', mode.ai) + script;
    try { await navigator.clipboard.writeText(text); toast('已複製，去 AI 那邊貼上'); }

  if (!P || !$('#list') || document.querySelector('.modal') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); // 空白鍵不要同時按到剛點過的按鈕
  if (e.code === 'Space') {
    e.preventDefault(); if (e.repeat) return;
    if (rec) return finish();
    if (P.sentences[cur].file && !e.shiftKey) return toast('這句已經錄好了。要重錄請按 Shift＋空白鍵，或按下方「重新錄」', 3500);
    start();
  }
  else if (e.key === 'Escape') cancel();
  else if (k === 'r' && rec) restart();
  else if (k === 'p' && !rec) playOne();
  else if (k === 'm') M.on ? metroStop() : metroStart();
  else if (e.key === 'ArrowDown' && !rec) { e.preventDefault(); cur = Math.min(P.sentences.length - 1, cur + 1); render(); }
  else if (e.key === 'ArrowUp' && !rec) { e.preventDefault(); cur = Math.max(0, cur - 1); render(); }
});

if (location.hash.startsWith('#p=')) openProject(decodeURIComponent(location.hash.slice(3))).catch(home); else home();
</script>
</body>
